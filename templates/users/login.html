{% extends 'base.html' %}

{% block title %}Giriş Yap{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card bg-dark border-secondary shadow">
            <div class="card-header border-secondary text-warning">
                <h3 class="text-center"><i class="fa-solid fa-right-to-bracket"></i> Giriş Yap</h3>
            </div>
            <div class="card-body">
                {% include 'partials/_alerts.html' %}

                <form action="{% url 'login' %}" method="POST">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label>Kullanıcı Adı</label>
                        <input type="text" name="username" class="form-control bg-secondary text-white border-0" required>
                    </div>
                    <div class="mb-3">
                        <label>Şifre</label>
                        <input type="password" name="password" class="form-control bg-secondary text-white border-0" required>
                    </div>
                    <button type="submit" class="btn btn-warning w-100 fw-bold">Giriş Yap</button>
                </form>
            </div>
            <div class="card-footer border-secondary text-center">
                Hesabın yok mu? <a href="{% url 'register' %}" class="text-warning">Kayıt Ol</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
