{% extends 'base.html' %}

{% block title %}İşlem Başarılı{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6">
        <div class="alert alert-success text-center shadow" role="alert">
            <h1 class="display-4"><i class="fa-solid fa-circle-check"></i></h1>
            <h4 class="alert-heading">Şifreniz Başarıyla Değiştirildi!</h4>
            <p>Hesabınızın güvenliği sağlandı. Yeni şifrenizle giriş yapmaya devam edebilirsiniz.</p>
            <hr>
            <div class="d-grid gap-2">
                <a href="{% url 'dashboard' %}" class="btn btn-success">
                    <i class="fa-solid fa-gauge"></i> İlanlarıma Dön
                </a>
                <a href="{% url 'index' %}" class="btn btn-outline-success">
                    <i class="fa-solid fa-home"></i> Ana Sayfaya Dön
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
