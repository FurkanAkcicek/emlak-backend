{% extends 'base.html' %}

{% block title %}Kayıt Ol{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card bg-dark border-secondary shadow">
            <div class="card-header border-secondary text-warning">
                <h3 class="text-center"><i class="fa-solid fa-user-plus"></i> Kayıt Ol</h3>
            </div>
            <div class="card-body">
                {% include 'partials/_alerts.html' %}
                
                <form action="{% url 'register' %}" method="POST">
                    {% csrf_token %}
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label>Ad</label>
                            <input type="text" name="first_name" class="form-control bg-secondary text-white border-0" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label>Soyad</label>
                            <input type="text" name="last_name" class="form-control bg-secondary text-white border-0" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label>Kullanıcı Adı</label>
                        <input type="text" name="username" class="form-control bg-secondary text-white border-0" required>
                    </div>
                    <div class="mb-3">
                        <label>Email</label>
                        <input type="email" name="email" class="form-control bg-secondary text-white border-0" required>
                    </div>
                    <div class="mb-3">
                        <label>Şifre</label>
                        <input type="password" name="password" class="form-control bg-secondary text-white border-0" required>
                    </div>
                    <div class="mb-3">
                        <label>Şifre (Tekrar)</label>
                        <input type="password" name="password_confirm" class="form-control bg-secondary text-white border-0" required>
                    </div>
                    <button type="submit" class="btn btn-warning w-100 fw-bold">Kayıt Ol</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
